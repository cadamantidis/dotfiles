name: Secret sweep

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: secret-sweep
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL -o "$asset" "$base_url/$asset"
          curl -sSL -o checksums.txt "$base_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $asset\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: cadamantidis
          NEW_FINDINGS_PATH: ${{ runner.temp }}/new-findings.json
        run: security-sweep/scan.sh

      - name: Notify on new findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FINDINGS_PATH: ${{ runner.temp }}/new-findings.json
        run: security-sweep/notify.sh

      - name: Commit updated baseline state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security-sweep/state
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(security-sweep): update baseline state"
            git push
          fi
